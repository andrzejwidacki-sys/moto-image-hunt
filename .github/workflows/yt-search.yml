name: YouTube search (metadata, no download)
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Zapytania rozdzielone znakiem |"
        default: "najpiękniejsze miejsca na wakacje|most beautiful places to travel|best vacation destinations"
      n:
        description: "Ile wyników na zapytanie i tryb"
        default: "8"
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search
        run: |
          python3 -m venv /tmp/yt && /tmp/yt/bin/pip install -q yt-dlp
          FLAT=1 /tmp/yt/bin/python yt/search.py "${{ inputs.queries }}" "${{ inputs.n }}" yt-out || true
      - name: Publish
        if: always() && hashFiles('yt-out/results.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd yt-out && git init -q -b yt-search
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "yt-search ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yt-search
