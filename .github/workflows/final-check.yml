name: Final check (Whisper on finished film audio)
on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: "Model Whisper"
        default: "medium"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: final-in
          path: in
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Whisper on final audio
        run: |
          python3 -m venv /tmp/asr
          /tmp/asr/bin/pip install -q faster-whisper num2words
          /tmp/asr/bin/python music/check_final.py in final-out "${{ inputs.whisper_model }}"
      - name: Publish
        if: always() && hashFiles('final-out/finalcheck.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd final-out
          git init -q -b final-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "finalcheck ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" final-out
