name: YouTube license evidence
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 yt/license_check.py lic-out || true
      - name: Publish
        if: always() && hashFiles('lic-out/license.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd lic-out && git init -q -b yt-license
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "yt-license ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yt-license
