name: Image hunt

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cel z targets.yml (pulsar-ns125, honda-ns125, ...)"
        type: string
        default: pulsar-ns125
      extra_queries:
        description: "Dodatkowe frazy oddzielone średnikiem, np. Rouser NS125;NS 125 Bajaj"
        type: string
        default: ""
      max_per_query:
        description: "Maks. wyników na jedno zapytanie w jednym źródle"
        type: string
        default: "200"
      include_video:
        description: "Szukaj też wideo"
        type: boolean
        default: true
      sources:
        description: "all albo lista: commons,flickr,pexels,pixabay,unsplash,github,openverse"
        type: string
        default: all
      max_images:
        description: "Ile podglądów zdjęć pobrać do repozytorium (0 = żadnych)"
        type: string
        default: "80"
      publish_results:
        description: "Zapisz wyniki i podglądy na gałęzi 'results' tego repozytorium"
        type: boolean
        default: true

permissions:
  contents: write   # only used to push the 'results' branch

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m unittest discover -s tests -v

      - name: Search
        env:
          # Inputs go through env vars, never straight into the shell script.
          TARGET: ${{ inputs.target }}
          EXTRA_QUERIES: ${{ inputs.extra_queries }}
          MAX_PER_QUERY: ${{ inputs.max_per_query }}
          INCLUDE_VIDEO: ${{ inputs.include_video }}
          SOURCES: ${{ inputs.sources }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--target "$TARGET" --extra-queries "$EXTRA_QUERIES" --max-per-query "$MAX_PER_QUERY" --sources "$SOURCES" --out results --verbose --source-budget 420)
          if [ "$INCLUDE_VIDEO" = "true" ]; then args+=(--include-video); fi
          python -m image_hunt "${args[@]}"

      - name: Download previews
        if: always() && hashFiles('results/results.json') != ''
        env:
          MAX_IMAGES: ${{ inputs.max_images }}
        run: python -m image_hunt.fetch_images --results results --max "$MAX_IMAGES" --verbose

      - name: Summary
        if: always()
        run: |
          if [ -f results/report.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < results/report.md; fi  # also echoes the report into the job log

      - name: Publish results to the results branch
        if: always() && inputs.publish_results && hashFiles('results/results.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in *[!A-Za-z0-9._-]*|"") echo "unsafe target name"; exit 1;; esac
          branch="results-$TARGET"
          out="$RUNNER_TEMP/results-branch"
          rm -rf "$out"
          cp -r results "$out"
          cd "$out"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Image hunt results for run ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-hunt-results
          path: results/
          if-no-files-found: warn
