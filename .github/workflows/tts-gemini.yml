name: TTS Gemini samples

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Modele Gemini TTS oddzielone przecinkiem"
        type: string
        default: "gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts,gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts"
      voices:
        description: "Gotowe głosy oddzielone przecinkiem"
        type: string
        default: "Kore"
      whisper_model:
        description: "Model Whisper do kontroli mowy (small, medium, large-v3 lub none)"
        type: string
        default: "medium"

permissions:
  contents: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy
      - name: Generate samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ inputs.models }}
          GEMINI_VOICES: ${{ inputs.voices }}
          OUT: ${{ github.workspace }}/tts-out
          PYTHONUNBUFFERED: "1"
        run: |
          test -n "$GEMINI_API_KEY" || { echo "Brak sekretu GEMINI_API_KEY"; exit 1; }
          cd tts && python run_gemini.py
      - name: Whisper check
        if: always() && inputs.whisper_model != 'none' && hashFiles('tts-out/report.json') != ''
        continue-on-error: true
        run: |
          python -m venv /tmp/asr
          /tmp/asr/bin/pip install -q faster-whisper num2words
          cd "$GITHUB_WORKSPACE/tts"
          /tmp/asr/bin/python check_whisper.py "$GITHUB_WORKSPACE/tts-out" "${{ inputs.whisper_model }}"
      - name: Publish
        if: always() && hashFiles('tts-out/report.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tts-out
          git init -q -b tts-gemini
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Gemini TTS run ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tts-gemini
