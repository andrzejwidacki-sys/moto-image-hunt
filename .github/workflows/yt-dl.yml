name: YouTube download attempt
on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID filmu"
        default: "eCtUQp9aISc"
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /tmp/yt && /tmp/yt/bin/pip install -q -U "yt-dlp[default]"
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          bash yt/dl.sh "${{ inputs.id }}" dl-out || true
          ls -la dl-out
      - name: Publish
        if: always() && hashFiles('dl-out/dl.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dl-out && git init -q -b yt-dl
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "yt-dl ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yt-dl
