name: Publish release (large files)

# Wgrywanie dużych plików (do 2 GiB na plik) na darmowy hosting: GitHub Releases.
# 1) wypchnij pliki na gałąź (np. orphan branch "film1-upload"), 2) uruchom ten workflow.
# Wynik: stałe linki https://github.com/<repo>/releases/download/<tag>/<plik>

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Gałąź z plikami do wgrania (wszystkie pliki z jej korzenia)"
        required: true
      tag:
        description: "Tag wydania, np. film1-commentary-v1"
        required: true
      title:
        description: "Tytuł wydania"
        required: true
      notes:
        description: "Opis wydania"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: files
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd files
          rm -rf .git
          ls -l
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber -R "$REPO"
          else
            gh release create "$TAG" ./* -R "$REPO" --title "$TITLE" --notes "$NOTES" --target main
          fi
          echo "## Linki" >> "$GITHUB_STEP_SUMMARY"
          for f in *; do echo "- https://github.com/$REPO/releases/download/$TAG/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f")" >> "$GITHUB_STEP_SUMMARY"; done
