name: YouTube CC details
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: yt-cc
          path: ytin
      - name: Fetch
        run: python3 yt/details.py ytin/cc.json yt-det yt/cc_ids.txt || true
      - name: Publish
        if: always() && hashFiles('yt-det/details.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd yt-det && git init -q -b yt-ccdet
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "yt-ccdet ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yt-ccdet
