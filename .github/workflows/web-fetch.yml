name: Web fetch (pages as text)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresy oddzielone spacją"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          OUT: web-out
        run: python3 webfetch/fetch.py
      - name: Publish
        if: always() && hashFiles('web-out/manifest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd web-out
          git init -q -b web-fetch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "web fetch ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-fetch
